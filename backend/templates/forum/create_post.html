{% extends 'base.html' %}

{% block title %}发布新帖 - 读书论坛{% endblock %}
{% block page_title %}发布新帖{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'category_detail' category.id %}" class="text-primary hover:text-secondary transition-colors">
        <i class="fas fa-arrow-left mr-2"></i>返回{{ category.name }}
    </a>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="p-6 border-b border-slate-200">
        <h3 class="text-lg font-semibold text-slate-800">在「{{ category.name }}」发布新帖</h3>
    </div>
    
    <form method="post" class="p-6">
        {% csrf_token %}
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-2">
                帖子标题 <span class="text-red-500">*</span>
            </label>
            <input type="text" name="title" required placeholder="请输入帖子标题"
                class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-2">
                关联图书 <span class="text-slate-400">(可选)</span>
            </label>
            <select name="book" 
                class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                <option value="">不关联图书</option>
                {% for book in books %}
                <option value="{{ book.id }}">{{ book.title }} - {{ book.author }}</option>
                {% endfor %}
            </select>
            <p class="text-sm text-slate-500 mt-1">关联图书后，帖子旁会显示图书封面小图</p>
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-2">
                帖子内容 <span class="text-red-500">*</span>
            </label>
            <textarea name="content" rows="10" required placeholder="请输入帖子内容..."
                class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none resize-none"></textarea>
        </div>
        
        <div class="flex items-center justify-end gap-4">
            <a href="{% url 'category_detail' category.id %}" 
                class="px-6 py-2 border border-slate-300 text-slate-600 rounded-xl hover:bg-slate-50 transition-colors">
                取消
            </a>
            <button type="submit" class="px-6 py-2 bg-primary text-white rounded-xl hover:bg-secondary transition-colors">
                <i class="fas fa-paper-plane mr-2"></i>发布帖子
            </button>
        </div>
    </form>
</div>
{% endblock %}
